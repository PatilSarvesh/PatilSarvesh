<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Sarvesh Patil engineering control panel</title>
  <desc id="desc">A terminal-inspired profile banner showing Sarvesh Patil's engineering roots in .NET, current Python and AWS focus, and JavaScript and TypeScript product work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset="0.6" stop-color="#091625"/>
      <stop offset="1" stop-color="#102b3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#2de2c5"/>
      <stop offset="1" stop-color="#ffb454"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#1c5267"/>
      <stop offset="1" stop-color="#09131f"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#9ec2d8" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(36 27)">
      <circle cx="7" cy="7" r="6" fill="#ff6b6b"/>
      <circle cx="28" cy="7" r="6" fill="#ffcc66"/>
      <circle cx="49" cy="7" r="6" fill="#2de2a6"/>
      <text x="80" y="12" fill="#6e899e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">sarvesh@github — engineering-control-panel</text>
      <text x="1118" y="12" fill="#2de2c5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">STATUS: BUILDING</text>
    </g>

    <line x1="36" y1="58" x2="1164" y2="58" stroke="#294356" stroke-width="1"/>

    <g transform="translate(64 94)">
      <rect width="190" height="244" rx="22" fill="url(#orb)" stroke="#27485d" stroke-width="1.5"/>
      <circle cx="95" cy="91" r="58" fill="#09131f" stroke="url(#accent)" stroke-width="3" filter="url(#glow)"/>
      <text x="95" y="109" fill="#f4f8fb" text-anchor="middle" font-size="50" font-weight="780" letter-spacing="-3">SP</text>
      <text x="95" y="182" fill="#9fb6c7" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2.4">SYSTEMS BUILDER</text>
      <rect x="41" y="205" width="108" height="24" rx="12" fill="#0d2b2b" stroke="#2de2c5" stroke-opacity="0.55"/>
      <circle cx="57" cy="217" r="4" fill="#2de2a6"/>
      <text x="69" y="221" fill="#b8f7e9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">ONLINE</text>
    </g>

    <g transform="translate(292 93)">
      <text x="0" y="49" fill="#f7fbff" font-size="48" font-weight="760" letter-spacing="1.5">SARVESH PATIL</text>
      <text x="2" y="78" fill="#8da8bb" font-size="14" font-weight="650" letter-spacing="2.7">APIs → CLOUD → AI-ENABLED SYSTEMS</text>

      <rect x="0" y="104" width="844" height="174" rx="15" fill="#050a11" fill-opacity="0.8" stroke="#263f51"/>
      <text x="25" y="137" fill="#2de2c5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">$ trace --career --format=signal</text>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
        <text x="25" y="173" fill="#617f94">ROOTS</text>
        <text x="124" y="173" fill="#d9e6ef">C# / .NET</text>
        <rect x="291" y="160" width="72" height="19" rx="9.5" fill="#211b40"/>
        <text x="327" y="174" fill="#b8a9ff" font-size="10" font-weight="700" text-anchor="middle">FOUNDATION</text>

        <text x="25" y="207" fill="#617f94">NOW</text>
        <text x="124" y="207" fill="#d9e6ef">Python / AWS</text>
        <rect x="291" y="194" width="72" height="19" rx="9.5" fill="#0e3431"/>
        <text x="327" y="208" fill="#8ff5df" font-size="10" font-weight="700" text-anchor="middle">ACTIVE</text>

        <text x="431" y="173" fill="#617f94">EDGE</text>
        <text x="530" y="173" fill="#d9e6ef">JavaScript / TypeScript</text>

        <text x="431" y="207" fill="#617f94">VECTOR</text>
        <text x="530" y="207" fill="#d9e6ef">Cloud + AI developer systems</text>
      </g>

      <line x1="25" y1="232" x2="819" y2="232" stroke="#1b3445"/>
      <text x="25" y="258" fill="#829cad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">principle: build the bridge, not just the feature</text>
      <rect x="759" y="246" width="60" height="5" rx="2.5" fill="url(#accent)"/>
    </g>

    <text x="64" y="383" fill="#6f899c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5">PROFILE SIGNAL / 2026</text>
    <text x="1136" y="383" fill="#6f899c" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.2">CLEAR CONTRACTS · USEFUL PRODUCTS · HUMAN-CENTERED AUTOMATION</text>
  </g>
</svg>
